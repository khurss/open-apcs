name: open-apcs-dev

x-node: &node
  image: ${DEV_IMAGE:-open-apcs-dev:node24-pnpm10}
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  init: true
  working_dir: /workspace
  user: "1000:1000"
  volumes:
    - .:/workspace
    - node_modules:/workspace/node_modules
    - pnpm_store:/pnpm/store

services:
  report-renderer:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    init: true
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /workspace/packages/report-renderer
    command: [node, node_modules/tsx/dist/cli.mjs, watch, --include, 'src/*.ts', --include, '../domain/src/*.ts', --exclude, '**/*.test.ts', src/watch.ts]
    environment: { HOME: /tmp, NODE_ENV: production, NODE_OPTIONS: '--max-old-space-size=128' }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    tmpfs: ["/tmp:rw,nosuid,size=268435456"]
    volumes:
      - ./packages/report-renderer:/workspace/packages/report-renderer:ro
      - ./packages/domain:/workspace/packages/domain:ro
      - ./package.json:/workspace/package.json:ro
      - node_modules:/workspace/node_modules:ro
    networks: [sandbox]
    healthcheck:
      test: [CMD, node, -e, "require('node:http').get('http://127.0.0.1:4100/live',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  script-runner:
    image: ${DEV_IMAGE:-open-apcs-dev:node24-pnpm10}
    init: true
    user: "1000:1000"
    working_dir: /workspace/packages/script-runtime
    command: [pnpm, dev]
    environment: { HOME: /tmp, NODE_ENV: production }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    tmpfs: ["/tmp:rw,noexec,nosuid,size=67108864"]
    volumes:
      - ./packages/script-runtime:/workspace/packages/script-runtime:ro
      - ./package.json:/workspace/package.json:ro
      - node_modules:/workspace/node_modules:ro
    networks: [sandbox]
    healthcheck:
      test: [CMD, node, -e, "require('node:http').get('http://127.0.0.1:4000/live',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  # Explicit initialization only; never installs dependencies on a watch restart.
  deps:
    <<: *node
    profiles: [tools]
    command: [sh, scripts/install-deps.sh]

  toolbox:
    <<: *node
    command: [node, -e, "setInterval(() => {}, 3600000)"]

  api:
    <<: *node
    command: [pnpm, --filter, '@open-apcs/api', dev]
    environment:
      APCS_POSTGRES_URL: postgres://apcs_dev:apcs_dev@postgres:5432/apcs_dev
      APCS_ORIGIN: http://localhost:5173
      APCS_MQTT_URL: mqtt://simulation-mqtt:1883
      APCS_SCRIPT_URL: http://script-runner:4000
      APCS_REPORT_URL: http://report-renderer:4100
      API_PORT: 3000
    ports: ["127.0.0.1:${API_PORT:-3100}:3000"]
    networks: [development, frontend, sandbox]
    depends_on:
      report-renderer:
        condition: service_healthy
      script-runner:
        condition: service_healthy
      postgres:
        condition: service_healthy
      simulation-mqtt:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "require('node:http').get('http://127.0.0.1:3000/api/v1/health/live',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *node
    command: [pnpm, --filter, '@open-apcs/web', dev]
    environment:
      APCS_API_PROXY: http://api:3000
    ports: ["127.0.0.1:5173:5173"]
    networks: [development, frontend]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "require('node:http').get('http://127.0.0.1:5173',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    profiles: [tools]
    user: "1000:1000"
    working_dir: /workspace
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./dist/backups:/backups
    networks: [development]
    environment:
      PGHOST: postgres
      PGUSER: apcs_dev
      PGPASSWORD: apcs_dev
      PGDATABASE: apcs_dev
    depends_on:
      postgres:
        condition: service_healthy
    command: [sh, scripts/database-backup.sh, /backups]

  simulation-mqtt:
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    networks: [development]
    volumes: ["./docker/mosquitto.simulation.conf:/mosquitto/config/mosquitto.conf:ro"]
    healthcheck:
      test: [CMD, mosquitto_pub, -h, localhost, -t, health, -m, ready]
      interval: 2s
      timeout: 3s
      retries: 20

  # Local development only; database ports are not published to the host.
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_USER: apcs_dev
      POSTGRES_PASSWORD: apcs_dev
      POSTGRES_DB: apcs_dev
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [development]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U apcs_dev -d apcs_dev"]
      interval: 2s
      timeout: 3s
      retries: 20

  unit-watch:
    <<: *node
    command: [pnpm, test:watch]
    stdin_open: true
    tty: true

volumes:
  node_modules:
  pnpm_store:
  postgres_data:

networks:
  sandbox:
    internal: true
  frontend: {}
  development:
    internal: true

name: open-apcs-dev

x-node: &node
  image: ${DEV_IMAGE:-open-apcs-dev:node24-pnpm10}
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  init: true
  working_dir: /workspace
  user: "1000:1000"
  volumes:
    - .:/workspace
    - node_modules:/workspace/node_modules
    - pnpm_store:/pnpm/store

services:
  # Explicit initialization only; never installs dependencies on a watch restart.
  deps:
    <<: *node
    profiles: [tools]
    command: [sh, scripts/install-deps.sh]

  toolbox:
    <<: *node
    command: [node, -e, "setInterval(() => {}, 3600000)"]

  api:
    <<: *node
    command: [pnpm, --filter, '@open-apcs/api', dev]
    environment:
      APCS_POSTGRES_URL: postgres://apcs_dev:apcs_dev@postgres:5432/apcs_dev
      APCS_ORIGIN: http://localhost:5173
      APCS_MQTT_URL: mqtt://simulation-mqtt:1883
      API_PORT: 3000
    ports: ["127.0.0.1:${API_PORT:-3100}:3000"]
    networks: [development, frontend]
    depends_on:
      postgres:
        condition: service_healthy
      simulation-mqtt:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *node
    command: [pnpm, --filter, '@open-apcs/web', dev]
    environment:
      APCS_API_PROXY: http://api:3000
    ports: ["127.0.0.1:5173:5173"]
    networks: [development, frontend]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    profiles: [tools]
    user: "1000:1000"
    working_dir: /workspace
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./dist/backups:/backups
    networks: [development]
    environment:
      PGHOST: postgres
      PGUSER: apcs_dev
      PGPASSWORD: apcs_dev
      PGDATABASE: apcs_dev
    depends_on:
      postgres:
        condition: service_healthy
    command: [sh, scripts/database-backup.sh, /backups]

  simulation-mqtt:
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    networks: [development]
    volumes: ["./docker/mosquitto.simulation.conf:/mosquitto/config/mosquitto.conf:ro"]
    healthcheck:
      test: [CMD, mosquitto_pub, -h, localhost, -t, health, -m, ready]
      interval: 2s
      timeout: 3s
      retries: 20

  # Local development only; database ports are not published to the host.
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_USER: apcs_dev
      POSTGRES_PASSWORD: apcs_dev
      POSTGRES_DB: apcs_dev
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [development]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U apcs_dev -d apcs_dev"]
      interval: 2s
      timeout: 3s
      retries: 20

  unit-watch:
    <<: *node
    command: [pnpm, test:watch]
    stdin_open: true
    tty: true

volumes:
  node_modules:
  pnpm_store:
  postgres_data:

networks:
  frontend: {}
  development:
    internal: true

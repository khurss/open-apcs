name: open-apcs-test

x-node: &node
  image: ${DEV_IMAGE:-open-apcs-dev:node24-pnpm10}
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  init: true
  working_dir: /workspace
  user: "1000:1000"
  volumes:
    - .:/workspace
    - node_modules:/workspace/node_modules
    - pnpm_store:/pnpm/store
  networks: [test]
  environment: &test-env
    NODE_ENV: test
    APCS_TEST_POSTGRES_URL: postgres://apcs_test:apcs_test@postgres:5432/apcs_test
    APCS_TEST_MQTT_URL: mqtt://mqtt:1883

x-dependencies: &dependencies
  postgres:
    condition: service_healthy
  mqtt:
    condition: service_healthy

services:
  deps:
    <<: *node
    profiles: [tools]
    networks: [bootstrap]
    command: [sh, scripts/install-deps.sh]

  unit:
    <<: *node
    command: [pnpm, test:unit]

  typecheck:
    <<: *node
    command: [pnpm, typecheck]

  integration:
    <<: *node
    depends_on: *dependencies
    command: [pnpm, test:integration]

  all:
    <<: *node
    depends_on: *dependencies
    command: [sh, -ec, "pnpm check:language && pnpm typecheck && pnpm test && pnpm --filter @open-apcs/web build"]

  unit-watch:
    <<: *node
    command: [pnpm, test:watch]
    stdin_open: true
    tty: true

  integration-watch:
    <<: *node
    depends_on: *dependencies
    command: [pnpm, test:integration:watch]
    stdin_open: true
    tty: true

  toolbox:
    <<: *node
    command: [node, -e, "setInterval(() => {}, 3600000)"]

  e2e-api:
    <<: *node
    command: [pnpm, --filter, '@open-apcs/api', exec, tsx, ../../tests/e2e/server.ts]
    depends_on: *dependencies
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20

  e2e-web:
    <<: *node
    command: [pnpm, --filter, '@open-apcs/web', dev]
    environment:
      <<: *test-env
      APCS_API_PROXY: http://e2e-api:3000
    depends_on:
      e2e-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    init: true
    user: "1000:1000"
    working_dir: /workspace
    shm_size: 1gb
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    network_mode: service:e2e-web
    environment: *test-env
    depends_on:
      e2e-web:
        condition: service_healthy
    command: [node, node_modules/@playwright/test/cli.js, test]

  offline-check:
    image: ${DEV_IMAGE:-open-apcs-dev:node24-pnpm10}
    init: true
    user: "1000:1000"
    working_dir: /workspace
    network_mode: none
    volumes:
      - .:/workspace:ro
      - pnpm_store:/cache/store:ro
      - /pnpm/store
    command: [sh, scripts/test-offline-deps.sh]

  backup-test:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    user: "1000:1000"
    working_dir: /workspace
    volumes: [".:/workspace:ro"]
    networks: [test]
    environment:
      PGHOST: postgres
      PGUSER: apcs_test
      PGPASSWORD: apcs_test
    depends_on:
      postgres:
        condition: service_healthy
    command: [sh, scripts/test-backup.sh]

  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_USER: apcs_test
      POSTGRES_PASSWORD: apcs_test
      POSTGRES_DB: apcs_test
    networks: [test]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U apcs_test -d apcs_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    networks: [test]
    volumes:
      - ./docker/mosquitto.test.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: [CMD, mosquitto_pub, -h, localhost, -t, health, -m, ready]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  node_modules:
  pnpm_store:

networks:
  # Application tests cannot reach the public internet.
  test:
    internal: true
  # Only the explicit dependency-installation task uses this network.
  bootstrap: {}
